[package]
name = "mail"
description = "A fast native Gmail client for Apple Silicon Macs, with a one-shot agent CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mail"
path = "src/main.rs"

[dependencies]
mail-core = { path = "../mail-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }
# JSON schemas for `mail agent tools`.
schemars = "1"
# Formats message dates in the local time zone.
jiff = "0.2"
# The window. OpenGL only; persistence remembers the window's size and place.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.36"
# Saves demo screenshots for the README and visual checks.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
