[workspace]
members = ["crates/mail-core", "crates/mail"]
default-members = ["crates/mail"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/fightingentropy/mail"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep dependencies (SQLite, TLS) fast in debug builds; the app crates stay
# incremental.
[profile.dev.package."*"]
opt-level = 2
